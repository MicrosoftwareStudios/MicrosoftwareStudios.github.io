<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink Search</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<link rel="icon" href="/resources/images/blinksmall.png" type="image/x-icon">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f3f3f3;
			background-image: url('/resources/images/blinkbg.png');
  			background-attachment: fixed;
  			background-size: cover;
  			background-position: center;
  			background-repeat: no-repeat;
  			margin: 0;
  			padding: 0;
        }

        .header-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        .search-container {
            margin-top: 20px;
            width: 80%;
            max-width: 800px;
            padding: 20px;
            background: white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h2><img src="/resources/images/blink.png">Search</h2>
        <script async src="https://cse.google.com/cse.js?cx=c493dd8fd98e44d27"></script>
        <div class="gcse-searchbox"></div>
    </div>

    <!-- Dedicated results container -->
    <div class="search-container">
	  <br>
	<div class="gcse-searchresults"></div>
  </div>
	<script>
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const query = params.get("q");
        if (query) {
            document.querySelector(".gcse-searchbox input").value = query;
            document.querySelector(".gcse-searchbox input").dispatchEvent(new Event("input"));
        }
    };
</script>

</body>
</html>
