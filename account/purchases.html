<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";

    const firebaseConfig = {
  	apiKey: "AIzaSyArDDSjt9QDPu-h2pqtO73Z1KDZrgAdMMo",

  	projectId: "ware-de78d",

  	appId: "1:434521846825:web:904d72c4e5f33a9af29838",
  	measurementId: "G-PW8T28ENKG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function getUserLicense(userId) {
    const userRef = doc(db, "users", userId);
    const snap = await getDoc(userRef);

    	if (snap.exists()) {
            const data = snap.data();
            const key = data.key;
            const edition = data.edition;
            console.log(`Product Key: ${key}`);
            console.log(`Edition: ${edition}`);
            document.getElementById("key").textContent = `Product Key: ${key}`;
            document.getElementById("edition").textContent = `Edition: ${edition}`;
        } else {
            console.error("User not found.");
            return null;
        }
    }

    getUserLicense("0lUS3otctRYhJKdO8J9bisvSNHz2");
