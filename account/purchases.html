<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";

    const firebaseConfig = {

  	projectId: "ware-de78d",

    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function getUserLicense(userId) {
    const userRef = doc(db, "users", userId);
    const snap = await getDoc(userRef);

    	if (snap.exists()) {
            const data = snap.data();
            const key = data.key;
            const edition = data.edition;
            console.log(`Product Key: ${key}`);
            console.log(`Edition: ${edition}`);
            return { key, edition };
            const keyDiv = document.getElementById("key");
            const editionDiv = document.getElementById("edition");
            keyDiv.textContent = key;
            editionDiv.textContent = edition;
        } else {
            console.error("User not found.");
            return null;
        }
    }

    getUserLicense("0lUS3otctRYhJKdO8J9bisvSNHz2");
</script>
