    function updateEditions() {
      const product = document.getElementById("product").value;
      const editionSelect = document.getElementById("editionDropdown");
      editionSelect.innerHTML = '<option value="">Select an edition</option>';

      if (editions[product]) {
        editions[product].forEach(edition => {
          const option = document.createElement("option");
          option.value = edition.toLowerCase().replace(/\s+/g, '-');
          option.textContent = edition;
          editionSelect.appendChild(option);
        });
      }
    }
