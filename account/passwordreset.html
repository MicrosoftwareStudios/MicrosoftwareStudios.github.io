<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your Microsoftware Account Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            padding: 40px;
            width: 300px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }

        .login-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .forgot-password {
            text-align: left;
            font-size: 12px;
            color: #0078D4;
            cursor: pointer;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-signin {
            width: 100%;
            padding: 10px;
            background-color: #0078D4;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }

        .btn-signin:hover {
            background-color: #005EA6;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="/resources/images/largeLogo.png" height="30">
        <div class="login-title">Reset your password</div>

        <input type="email" id="email" placeholder="Enter your email">

        <button class="btn-signin" onclick="sendReset()">Send password reset email</button>

        <div id="status" style="font-size:12px; margin-top:10px;"></div>

        <br>
        <a href="/signin.html"><div class="forgot-password">Back to sign in</div></a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyArDDSjt9QDPu-h2pqtO73Z1KDZrgAdMMo",
            authDomain: "ware-de78d.firebaseapp.com",
            projectId: "ware-de78d",
            storageBucket: "ware-de78d.firebasestorage.app",
            messagingSenderId: "434521846825",
            appId: "1:434521846825:web:904d72c4e5f33a9af29838",
            measurementId: "G-PW8T28ENKG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const analytics = getAnalytics(app);

        window.sendReset = function() {
            const email = document.getElementById("email").value;
            const status = document.getElementById("status");

            if (!email) {
                status.style.color = "red";
                status.textContent = "Please enter your email.";
                return;
            }

            sendPasswordResetEmail(auth, email)
                .then(() => {
                    status.style.color = "green";
                    status.textContent = "A reset link has been sent to your email.";
                })
                .catch(error => {
                    status.style.color = "red";
                    status.textContent = "Error: " + error.message;
                });
        };
    </script>
</body>
</html>
