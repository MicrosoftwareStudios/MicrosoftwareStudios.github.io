<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset your password</title>
  <link rel="stylesheet" href="https://microsoftwarestudios.github.io/styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Additional small tweaks to match Microsoft-like layout */
    .reset-container {
      max-width: 440px;
      margin: 80px auto;
      background: white;
      padding: 40px;
      border: 1px solid #ddd;
      border-radius: 2px;
    }

    .title {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .subtitle {
      margin-bottom: 20px;
      color: #555;
    }

    .input-label {
      font-size: 0.9rem;
      margin-bottom: 6px;
      display: block;
    }

    .input-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #888;
      border-radius: 2px;
      font-size: 1rem;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #0067b8;
      color: white;
      border: none;
      border-radius: 2px;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: #005a9e;
    }

    .message {
      margin-top: 15px;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>

  <div class="reset-container">
    <div class="title">Reset your password</div>
    <div class="subtitle">Enter the email associated with your account.</div>

    <label class="input-label">Email address</label>
    <input id="emailInput" type="email" class="input-box" placeholder="example@domain.com">

    <button class="btn-primary" id="resetBtn">Send reset link</button>

    <div id="statusMessage" class="message"></div>
  </div>

  <!-- Firebase Initialization -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-analytics.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyArDDSjt9QDPu-h2pqtO73Z1KDZrgAdMMo",
      authDomain: "ware-de78d.firebaseapp.com",
      projectId: "ware-de78d",
      storageBucket: "ware-de78d.firebasestorage.app",
      messagingSenderId: "434521846825",
      appId: "1:434521846825:web:904d72c4e5f33a9af29838",
      measurementId: "G-PW8T28ENKG"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    // Reset button logic
    document.getElementById("resetBtn").addEventListener("click", async () => {
      const email = document.getElementById("emailInput").value.trim();
      const status = document.getElementById("statusMessage");

      if (!email) {
        status.textContent = "Please enter your email.";
        status.style.color = "red";
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        status.textContent = "A password reset link has been sent to your email.";
        status.style.color = "green";
      } catch (error) {
        status.textContent = "Error: " + error.message;
        status.style.color = "red";
      }
    });
  </script>

</body>
</html>
