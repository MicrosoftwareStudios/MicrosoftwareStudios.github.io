<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In to your Microsoftware Account</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            padding: 40px;
            width: 300px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }

        .login-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .forgot-password {
            text-align: left;
            font-size: 12px;
            color: #0078D4;
            cursor: pointer;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-signin {
            width: 100%;
            padding: 10px;
            background-color: #0078D4;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }

        .btn-signin:hover {
            background-color: #005EA6;
        }
	.links {
	    display: inline;
	}
    </style>
</head>
<body>
    <div class="login-container">
        <img src="resources/images/largeLogo.png" height="30">
        <div class="login-title">Sign in</div>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
	<div>
		<a href="signup.html"><div class="forgot-password">No account? Create one!</div></a>
		<br>
        	<a href="https://microsoftwarestudios.github.io/404.html"><div class="forgot-password">Forgot password?</div></a>
	</div class="links">
        <button class="btn-signin" onclick="signIn()">Sign in</button>
    </div>
   <script>
    // Run the function when the page loads
    window.onload = function() {
        if (document.cookie.includes("staySignedIn=true")) {
            window.location.href = "account/dashboard.html"; // Redirect if logged in
        }
    };
    </script>

    <script type="module">
        // Import Firebase functions
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-analytics.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyArDDSjt9QDPu-h2pqtO73Z1KDZrgAdMMo",
            authDomain: "ware-de78d.firebaseapp.com",
            projectId: "ware-de78d",
            storageBucket: "ware-de78d.firebasestorage.app",
            messagingSenderId: "434521846825",
            appId: "1:434521846825:web:904d72c4e5f33a9af29838",
            measurementId: "G-PW8T28ENKG"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const analytics = getAnalytics(app);

        // Sign-in function
        window.signIn = function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
        .then(userCredential => {
            const userId = userCredential.user.uid;

            // Set cookie with user ID
            const expires = new Date();
            expires.setTime(expires.getTime() + (30 * 24 * 60 * 60 * 1000)); // 7 days
            document.cookie = `userID=${userId}; expires=${expires.toUTCString()}; path=/; secure`;

            // Redirect to session page
            window.location.href = "session-redirect.html";
        })
        .catch(error => alert("Error: " + error.message));
};

</body>
</html>
