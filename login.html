<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {font-family: Arial, Helvetica, sans-serif;}
form {border: 3px solid #f1f1f1;}

input[type=email], input[type=password] {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

button {
  background-color: #04AA6D;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 100%;
}

button:hover {
  opacity: 0.8;
}

.cancelbtn {
  width: auto;
  padding: 10px 18px;
  background-color: #f44336;
}

.imgcontainer {
  text-align: center;
  margin: 24px 0 12px 0;
}

img.avatar {
  width: 40%;
  border-radius: 50%;
}

.container {
  padding: 16px;
}

span.loginPassword {
  float: right;
  padding-top: 16px;
}

/* Change styles for span and cancel button on extra small screens */
@media screen and (max-width: 300px) {
  span.loginPassword {
     display: block;
     float: none;
  }
  .cancelbtn {
     width: 100%;
  }
}
</style>
  <script>
   // Sign-Up Function
   function signUp() {
       const email = document.getElementById("signupEmail").value;
       const password = document.getElementById("signupPassword").value;

       firebase.auth().createUserWithEmailAndPassword(email, password)
           .then((userCredential) => {
               alert("Sign-Up Successful!");
               console.log("User signed up:", userCredential.user);
           })
           .catch((error) => {
               alert("Error: " + error.message);
               console.error("Sign-Up Error:", error);
           });
   }

   // Login Function
   function login() {
       const email = document.getElementById("loginEmail").value;
       const password = document.getElementById("loginPassword").value;

       firebase.auth().signInWithEmailAndPassword(email, password)
           .then((userCredential) => {
               alert("Login Successful!");
               console.log("User logged in:", userCredential.user);
           })
           .catch((error) => {
               alert("Error: " + error.message);
               console.error("Login Error:", error);
           });
   }
</script>

</head>
<body>

<h2>Log in to your Microsoftware Account</h2>


  <div class="container">
    <label for="loginEmail"><b>Email</b></label>
    <input type="email" id="loginPassword" placeholder="Enter Email" name="loginEmail" required>

    <label for="loginPassword"><b>Password</b></label>
    <input type="password" id="loginPassword" placeholder="Enter Password" name="loginPassword" required>
        
    <button type="submit" onclick="login">Login</button>
    <label>
      <input type="checkbox" checked="checked" name="remember"> Remember me
    </label>
  </div>

  <div class="container" style="background-color:#f1f1f1">
    <button type="button" class="cancelbtn" onclick="window.location.href = 'index.html'">Cancel</button>
    <span class="psw">Forgot <a href="#">password?</a></span>
    <p>Don't have an account? <a href="signin.html">Sign up!</a></p>
  </div>
</form>

</body>
</html>
